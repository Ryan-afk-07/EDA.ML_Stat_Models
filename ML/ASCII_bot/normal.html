  <div class="navigation">
    <span class="prev-btn">
      <i class="bx bx-chevron-left"></i>
    </span>
    <span class="next-btn">
      <i class="bx bx-chevron-right"></i>
    </span>
  </div>


  <script>
    const megaButtons = document.querySelectorAll('.mega-btn');
    megaButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const pokemonCard = btn.closest('.pokemon-card')
        const normal = pokemonCard.querySelector('.sprite.normal');
        const mega = pokemonCard.querySelector('.sprite.mega');
        const megaX = pokemonCard.querySelector('.sprite.mega.x');
        const megaY = pokemonCard.querySelector('.sprite.mega.y');
        const isMega = mega.classList.contains('active');
        const isMegaX = megaX.classList.contains('active');

        if (mega) {
          normal.classList.toggle('active', !isMega);
          mega.classList.toggle('active', isMega);
        }
        if (megaX) {
          normal.classList.toggle('active', isMegaX);
          megaX.classList.toggle('active', !isMegaX);
        }
        if (megaY) {
          normal.classList.toggle('active', isMegaY);
          megaY.classList.toggle('active', !isMegaY);
        }
      });
    });

    const bg = document.querySelector('.bg_carousel');
    const slider = document.querySelector('.pokemon_slider');
    const nextBtn = document.querySelector('.next-btn');
    const prevBtn = document.querySelector('.prev-btn');


    function resetMegaForms() {
      document.querySelectorAll('.pokemon-card').forEach(card => {
        const normal = card.querySelector('.sprite.normal');
        const mega = card.querySelector('.sprite.mega');
        const megaX = card.querySelector('.sprite.mega.x');
        const megaY = card.querySelector('.sprite.mega.y');

        if (mega && mega.classList.contains('active')) {
          normal.classList.add('active');
          mega.classList.remove('active');
        }
        if (megaX && megaX.classList.contains('active')) {
          normal.classList.add('active');
          megaX.classList.remove('active');
        }
        if (megaY && megaY.classList.contains('active')) {
          normal.classList.add('active');
          megaY.classList.remove('active');
        }
      });
    }

    const slidewidth = 400;
    const totalslides = 50
    let index = 0;
    nextBtn.addEventListener('click', () => {
      index = (index + 1) % totalslides;

      bg.style.transform = `translateX(${-index * 100}vw)`;
      slider.style.transform = `translateX(${-index * slidewidth}px)`;
      resetMegaForms();
    });

    prevBtn.addEventListener('click', () => {
      index = (index - 1 + totalslides) % totalslides;
      bg.style.transform = `translateX(${-index * 100}vw)`;
      slider.style.transform = `translateX(${-index * slidewidth}px)`;
      resetMegaForms();
    });

  </script>
